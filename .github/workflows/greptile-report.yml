name: Greptile blast-radius report

# Re-generates reports/<pr>.json every time Greptile (or anyone) posts a review
# on a PR, and on demand via workflow_dispatch.
on:
  pull_request_review:
    types: [submitted]
  pull_request_review_comment:
    types: [created, edited]
  issue_comment:
    types: [created, edited]
  workflow_dispatch:
    inputs:
      pr:
        description: PR number
        required: true

permissions:
  contents: write
  pull-requests: read

jobs:
  report:
    # Only run for PR-related comments (issue_comment also fires on plain issues)
    if: github.event_name != 'issue_comment' || github.event.issue.pull_request
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # reports are committed to main so blast-radius.html can fetch them
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Resolve PR number
        id: pr
        run: |
          case "${{ github.event_name }}" in
            workflow_dispatch) echo "number=${{ github.event.inputs.pr }}" >> "$GITHUB_OUTPUT" ;;
            issue_comment)     echo "number=${{ github.event.issue.number }}" >> "$GITHUB_OUTPUT" ;;
            *)                 echo "number=${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Generate report
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/greptile-report.mjs "${{ steps.pr.outputs.number }}" "${{ github.repository }}"

      - uses: actions/upload-artifact@v4
        with:
          name: greptile-report-${{ steps.pr.outputs.number }}
          path: reports/${{ steps.pr.outputs.number }}.json

      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/
          git diff --cached --quiet && exit 0
          git commit -m "chore: greptile report for PR #${{ steps.pr.outputs.number }}"
          git push
