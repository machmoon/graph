<title>Blast Radius</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fira+Code:wght@400;500&display=swap">
<style>
:root{--bg:#070a10;--sf:#0c1018;--tx:#8a99b0;--txd:#3a4a60;--txb:#dce6f0;--bd:#152035;--acc:#38bdf8;--grn:#22c55e;--amb:#f59e0b;--blu:#3b82f6;--red:#ef4444}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--tx);font-family:'DM Sans',system-ui,sans-serif;overflow:hidden;height:100vh}

#crumb{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:20;display:flex;align-items:center;gap:6px;font-family:'Fira Code',monospace;font-size:11px;background:var(--sf);border:1px solid var(--bd);border-radius:5px;padding:6px 14px}
.bc{color:var(--txd);cursor:default}.bc.click{color:var(--acc);cursor:pointer}.bc.click:hover{color:var(--txb)}.bc.on{color:var(--txb)}.bcsep{color:var(--txd)}

#sidebar{position:fixed;top:12px;left:12px;width:250px;background:var(--sf);border:1px solid var(--bd);border-radius:6px;padding:14px;z-index:10;font-size:11px;max-height:calc(100vh - 24px);overflow-y:auto}

#sidebar h1{font-size:15px;font-weight:700;color:var(--txb);margin-bottom:1px}
.sub{color:var(--txd);font-size:10px;font-family:'Fira Code',monospace;margin-bottom:10px}
.div{height:1px;background:var(--bd);margin:8px 0}
.lbl{font-size:9px;font-weight:600;color:var(--txd);letter-spacing:1px;text-transform:uppercase;margin-bottom:5px;font-family:'Fira Code',monospace}
.pr-btn{display:block;width:100%;text-align:left;background:#0a0f18;border:1px solid var(--bd);border-radius:5px;padding:7px 9px;margin-bottom:5px;cursor:pointer;font-family:inherit;font-size:11px;color:var(--tx);transition:border-color .2s,background .2s}
.pr-btn:hover{border-color:#2a3a55;background:#0e1520}.pr-btn.active{border-color:var(--acc);background:#0c1a2e}
.pr-id{font-family:'Fira Code',monospace;font-size:10px;color:var(--txd)}
.pr-title{color:var(--txb);font-weight:500;margin-top:1px}
.pr-meta{font-size:9px;color:var(--txd);margin-top:1px;font-family:'Fira Code',monospace}
.pt{display:inline-block;padding:1px 5px;border-radius:3px;font-size:8px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-right:3px}
.pt.feat{background:#052e16;color:var(--grn)}.pt.fix{background:#2a1a05;color:var(--amb)}.pt.refactor{background:#0f1d3d;color:var(--blu)}
.stat-row{display:flex;gap:10px;margin-bottom:6px}.stat{text-align:center;flex:1}
.stat-v{font-size:20px;font-weight:700;color:var(--txb);line-height:1}.stat-u{font-size:9px;color:var(--txd);font-family:'Fira Code',monospace}
#analysis{display:none}
.ci{background:#0a0f18;border:1px solid var(--bd);border-radius:5px;padding:7px 9px;margin-bottom:5px}
.ci.has-diff{cursor:pointer;transition:border-color .15s,background .15s}.ci.has-diff:hover{border-color:#31506e;background:#0d1622}
.ci-open{margin-top:5px;color:var(--acc);font-family:'Fira Code',monospace;font-size:9px;font-style:normal}
.ci.indirect{border-style:dashed;opacity:.65}
.ci-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:2px}
.ci-n{font-weight:600;color:var(--txb);font-size:12px}
.ci-b{font-family:'Fira Code',monospace;font-size:9px}.ci-b .a{color:var(--grn)}.ci-b .d{color:var(--red)}
.ci-f{font-size:10px;color:var(--txd);font-family:'Fira Code',monospace;line-height:1.4}
.ci-s{font-size:10px;color:var(--tx);margin-top:3px;line-height:1.3;font-style:italic}
.ci-it{font-size:9px;color:var(--txd);font-style:italic}

/* ══ CODE DIFF PANEL ══ */
#code-panel{position:fixed;top:12px;right:12px;width:min(640px,calc(100vw - 298px));height:calc(100vh - 24px);z-index:40;display:none;flex-direction:column;background:#090d14;border:1px solid #22324a;border-radius:7px;box-shadow:0 24px 80px rgba(0,0,0,.55);overflow:hidden}
.code-head{display:flex;align-items:flex-start;justify-content:space-between;padding:14px 16px 12px;border-bottom:1px solid var(--bd);background:#0c111a}
.code-kicker{font-family:'Fira Code',monospace;font-size:9px;letter-spacing:.8px;text-transform:uppercase;color:var(--acc);margin-bottom:4px}
.code-title{font-size:16px;font-weight:700;color:var(--txb)}
.code-sub{font-family:'Fira Code',monospace;font-size:9px;color:var(--txd);margin-top:3px}
#code-close{border:1px solid var(--bd);background:#0a0f18;color:var(--tx);width:28px;height:28px;border-radius:4px;cursor:pointer;font-size:16px;line-height:1}#code-close:hover{border-color:var(--acc);color:var(--txb)}
#file-tabs{display:flex;gap:4px;padding:8px 10px;border-bottom:1px solid var(--bd);overflow-x:auto;background:#0a0f17;flex-shrink:0}
#file-tabs::-webkit-scrollbar{height:3px}#file-tabs::-webkit-scrollbar-thumb{background:#25344a}
.file-tab{border:1px solid transparent;background:transparent;color:#65758c;padding:5px 8px;border-radius:4px;cursor:pointer;font-family:'Fira Code',monospace;font-size:9px;white-space:nowrap}.file-tab:hover{color:var(--txb);background:#101824}.file-tab.active{color:var(--txb);border-color:#29415e;background:#101b29}
#diff-meta{display:flex;align-items:center;gap:10px;padding:7px 12px;border-bottom:1px solid var(--bd);font-family:'Fira Code',monospace;font-size:9px;color:var(--txd);flex-shrink:0}.dm-add{color:#4ade80}.dm-del{color:#f87171}.dm-note{margin-left:auto;color:#53647b}
#diff-view{overflow:auto;flex:1;background:#070a10;font-family:'Fira Code',ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;line-height:1.55;padding:8px 0 24px}
#diff-view::-webkit-scrollbar{width:7px;height:7px}#diff-view::-webkit-scrollbar-thumb{background:#25344a;border-radius:4px}
.diff-row{display:grid;grid-template-columns:45px 45px 22px minmax(max-content,1fr);min-height:18px;border-left:3px solid transparent}
.diff-row.add{background:rgba(34,197,94,.10);border-left-color:#22c55e}.diff-row.del{background:rgba(239,68,68,.10);border-left-color:#ef4444}.diff-row.hunk{display:block;background:#0b1724;color:#60a5fa;border-left-color:#2563eb;padding:5px 12px;margin:7px 0 3px}
.diff-num{color:#34445a;text-align:right;padding:0 8px;border-right:1px solid #111b2a;user-select:none}.diff-mark{text-align:center;color:#45566d;user-select:none}.add .diff-mark{color:#4ade80}.del .diff-mark{color:#f87171}
.diff-code{white-space:pre;padding:0 12px;color:#9aa9bb}.add .diff-code{color:#bbf7d0}.del .diff-code{color:#fecaca}
.diff-empty{height:100%;display:flex;align-items:center;justify-content:center;text-align:center;padding:40px;color:var(--txd);font-size:11px;line-height:1.6}.diff-empty strong{display:block;color:var(--txb);font-size:13px;margin-bottom:5px}
@media(max-width:900px){#code-panel{left:12px;width:calc(100vw - 24px)}}

/* ══ CONTROLS ══ */
#controls{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:20;display:none;align-items:center;gap:8px;background:var(--sf);border:1px solid var(--bd);border-radius:6px;padding:6px 10px}
#controls button{background:#0a0f18;border:1px solid var(--bd);color:var(--tx);padding:5px 14px;border-radius:4px;font-family:'Fira Code',monospace;font-size:10px;cursor:pointer;transition:all .15s;white-space:nowrap}
#controls button:hover{border-color:var(--acc);color:var(--txb)}
#controls button.active-ctrl{border-color:var(--acc);color:var(--acc);background:#0c1a2e}
#controls button:disabled{opacity:.3;cursor:default;border-color:var(--bd);color:var(--txd)}

svg{display:block;width:100vw;height:100vh}
.tier-label{font-family:'Fira Code',monospace;font-size:9px;fill:#1a2a40;letter-spacing:1.5px}
.node-group{cursor:pointer}.node-box{transition:fill .5s}.node-border{transition:stroke .5s,stroke-width .4s,stroke-dasharray .3s}
.node-tag,.node-label,.node-info{transition:fill .5s}
.edge-path{fill:none;stroke:#141e30;stroke-width:1.2;transition:stroke .5s,stroke-width .4s}
.node-group.dimmed .node-box{fill:#080c12!important}.node-group.dimmed .node-border{stroke:#101820!important}
.node-group.dimmed .node-tag{fill:#1a2535!important}.node-group.dimmed .node-label{fill:#2a3a4a!important}.node-group.dimmed .node-info{fill:#101820!important}
.change-badge{transition:opacity .5s}
.zoom-hint{font-family:'Fira Code',monospace;font-size:8px;fill:var(--acc);opacity:0;transition:opacity .2s;cursor:pointer}
.node-group:hover .zoom-hint{opacity:.8}
#gArch,#gMod{transition:opacity .45s ease}
.tip{position:fixed;background:var(--sf);border:1px solid var(--bd);padding:6px 10px;border-radius:4px;font-size:11px;pointer-events:none;display:none;z-index:20;max-width:240px}
.tip-n{font-weight:600;color:var(--txb);margin-bottom:2px}.tip-f{font-family:'Fira Code',monospace;font-size:9px;color:var(--txd)}
.tip-s{font-size:10px;color:var(--tx);margin-top:3px;font-style:italic}
/* ══ GREPTILE REVIEW ══ */
.gr-badge{display:inline-flex;align-items:center;gap:4px;font-family:'Fira Code',monospace;font-size:8px;font-weight:600;letter-spacing:.4px;text-transform:uppercase;padding:1px 5px;border-radius:3px;border:1px solid currentColor;margin-left:6px;vertical-align:middle;white-space:nowrap}
.gr-badge::before{content:'';width:5px;height:5px;border-radius:50%;background:currentColor}
.gr-row{display:block;margin:3px 10px 6px 112px;padding:6px 10px;border-radius:4px;background:#0c1420;border:1px solid #1e2e45;border-left:3px solid currentColor;font-family:'DM Sans',sans-serif;font-size:10.5px;line-height:1.45;color:#b8c4d4;white-space:normal;max-width:640px}

.gr-row code{font-family:'Fira Code',monospace;font-size:9.5px;color:#dce6f0;background:#111b2a;padding:0 3px;border-radius:2px}
.gr-src{font-size:9px;color:var(--txd);font-family:'Fira Code',monospace;margin-bottom:5px;line-height:1.4}
.gr-sum{font-size:10.5px;color:var(--tx);line-height:1.45;margin-bottom:6px}
.gr-chip{display:inline-block;font-family:'Fira Code',monospace;font-size:9px;padding:1px 6px;border-radius:3px;background:#0a0f18;border:1px dashed #2a3a55;color:#8a99b0;margin:0 4px 4px 0}
.pr-meta .gr-badge{margin-left:6px}
</style>

<div class="tip" id="tip"></div>

// Builds reverse adjacency, renders nodes/edges to SVG.
// To change node appearance or layout, modify renderGraph().
// ════════════════════════════════════════════════════════════
function buildReverse(edges){const r={};edges.forEach(([f,t])=>{if(!r[t])r[t]=[];r[t].push(f)});return r}
const archRev=buildReverse(ARCH_EDGES), modRev=buildReverse(MOD_EDGES);

const svg=document.getElementById('g');
svg.setAttribute('viewBox',`0 0 ${W} ${H}`);

const defs=document.createElementNS(NS,'defs');
['arr','arr-b'].forEach(id=>{
  const m=document.createElementNS(NS,'marker');
  m.setAttribute('id',id);m.setAttribute('viewBox','0 0 8 6');
  m.setAttribute('refX','8');m.setAttribute('refY','3');m.setAttribute('markerWidth','7');m.setAttribute('markerHeight','5');m.setAttribute('orient','auto');
  const p=document.createElementNS(NS,'path');p.setAttribute('d','M0,.5 L7,3 L0,5.5');
  p.setAttribute('fill',id==='arr'?'#1a2a40':'currentColor');
  m.appendChild(p);defs.appendChild(m);
});
const glow=document.createElementNS(NS,'filter');glow.setAttribute('id','glow');
const blur=document.createElementNS(NS,'feGaussianBlur');blur.setAttribute('stdDeviation','4');blur.setAttribute('result','b');glow.appendChild(blur);
const merge=document.createElementNS(NS,'feMerge');
const mn1=document.createElementNS(NS,'feMergeNode');mn1.setAttribute('in','b');merge.appendChild(mn1);
const mn2=document.createElementNS(NS,'feMergeNode');mn2.setAttribute('in','SourceGraphic');merge.appendChild(mn2);
glow.appendChild(merge);defs.appendChild(glow);
svg.appendChild(defs);

const gArch=document.createElementNS(NS,'g');gArch.id='gArch';
const gMod=document.createElementNS(NS,'g');gMod.id='gMod';gMod.style.opacity='0';gMod.style.pointerEvents='none';
svg.appendChild(gArch);svg.appendChild(gMod);

function makePath(a,b){
  if(Math.abs(a.y-b.y)<NH+20){
    const s=b.x>a.x?a.x+NW/2:a.x-NW/2;
    const e=b.x>a.x?b.x-NW/2-5:b.x+NW/2+5;
    return`M${s},${a.y} L${e},${b.y}`;
  }
  const sy=a.y+NH/2,ey=b.y-NH/2-5,dy=ey-sy;
  return`M${a.x},${sy} C${a.x},${sy+dy*.5} ${b.x},${ey-dy*.5} ${b.x},${ey}`;
}

function renderGraph(nodes,edges,container){
  const nMap={};nodes.forEach(n=>nMap[n.id]=n);
  const eEls=edges.map(([fid,tid])=>{
    const p=document.createElementNS(NS,'path');
    p.setAttribute('d',makePath(nMap[fid],nMap[tid]));
    p.setAttribute('class','edge-path');p.setAttribute('marker-end','url(#arr)');
    p.dataset.from=fid;p.dataset.to=tid;
    container.appendChild(p);return p;
  });
  const nEls={};
  nodes.forEach(n=>{
    const g=document.createElementNS(NS,'g');g.setAttribute('class','node-group');
    g.setAttribute('transform',`translate(${n.x},${n.y})`);g.dataset.id=n.id;
    const box=document.createElementNS(NS,'rect');
    box.setAttribute('x',-NW/2);box.setAttribute('y',-NH/2);box.setAttribute('width',NW);box.setAttribute('height',NH);
    box.setAttribute('rx',NR);box.setAttribute('fill','#0e1420');box.setAttribute('class','node-box');g.appendChild(box);
    const bdr=document.createElementNS(NS,'rect');
    bdr.setAttribute('x',-NW/2);bdr.setAttribute('y',-NH/2);bdr.setAttribute('width',NW);bdr.setAttribute('height',NH);
    bdr.setAttribute('rx',NR);bdr.setAttribute('fill','none');bdr.setAttribute('stroke','#1e2e45');bdr.setAttribute('stroke-width','1');
    bdr.setAttribute('class','node-border');g.appendChild(bdr);
    const bar=document.createElementNS(NS,'rect');
    bar.setAttribute('x',-NW/2+2);bar.setAttribute('y',-NH/2+5);bar.setAttribute('width',3);bar.setAttribute('height',NH-10);
    bar.setAttribute('rx',1);bar.setAttribute('fill','#2a3a55');bar.setAttribute('opacity','.5');bar.setAttribute('class','node-bar');g.appendChild(bar);
    const tag=document.createElementNS(NS,'text');tag.textContent=n.tag;
    tag.setAttribute('x',-NW/2+14);tag.setAttribute('y',-NH/2+16);tag.setAttribute('fill','#3a5070');
    tag.setAttribute('font-size','8');tag.setAttribute('font-family',"'Fira Code',monospace");
    tag.setAttribute('letter-spacing','.6');tag.setAttribute('class','node-tag');g.appendChild(tag);
    const lbl=document.createElementNS(NS,'text');lbl.textContent=n.label;
    lbl.setAttribute('x',-NW/2+14);lbl.setAttribute('y',-NH/2+33);lbl.setAttribute('fill','#8a99b0');
    lbl.setAttribute('font-size','13');lbl.setAttribute('font-family',"'DM Sans',sans-serif");
    lbl.setAttribute('font-weight','600');lbl.setAttribute('class','node-label');g.appendChild(lbl);
    const info=document.createElementNS(NS,'text');info.textContent=n.zoomLabel||'';
    info.setAttribute('x',-NW/2+14);info.setAttribute('y',-NH/2+47);info.setAttribute('fill','#2a3a50');
    info.setAttribute('font-size','9');info.setAttribute('font-family',"'Fira Code',monospace");
    info.setAttribute('class','node-info');g.appendChild(info);
    if(n.zoomable){
      const zh=document.createElementNS(NS,'text');zh.textContent='EXPLORE ▸';
      zh.setAttribute('x',NW/2-8);zh.setAttribute('y',-NH/2+47);zh.setAttribute('text-anchor','end');
      zh.setAttribute('class','zoom-hint');g.appendChild(zh);g.style.cursor='zoom-in';
    }
    const bdg=document.createElementNS(NS,'g');bdg.setAttribute('class','change-badge');bdg.setAttribute('opacity','0');
    bdg.setAttribute('transform',`translate(${NW/2-8},${-NH/2-6})`);
    const bb=document.createElementNS(NS,'rect');bb.setAttribute('x',-30);bb.setAttribute('y',-8);
    bb.setAttribute('width',38);bb.setAttribute('height',16);bb.setAttribute('rx',3);
    bb.setAttribute('fill','#0a0f18');bb.setAttribute('stroke','#1e2e45');bb.setAttribute('stroke-width','1');bdg.appendChild(bb);
    const bt=document.createElementNS(NS,'text');bt.setAttribute('x',-11);bt.setAttribute('y',3);
    bt.setAttribute('text-anchor','middle');bt.setAttribute('font-size','9');bt.setAttribute('fill','#8a99b0');
    bt.setAttribute('font-family',"'Fira Code',monospace");bdg.appendChild(bt);g.appendChild(bdg);
    g.addEventListener('mouseenter',e=>showTip(e,n));g.addEventListener('mouseleave',hideTip);
    container.appendChild(g);
    nEls[n.id]={g,box,bdr,bar,tag,lbl,info,bdg,bb,bt};
  });
  return{nEls,eEls,nMap};
}

const arch=renderGraph(ARCH_NODES,ARCH_EDGES,gArch);
const mod=renderGraph(MOD_NODES,MOD_EDGES,gMod);

// ════════════════════════════════════════════════════════════
// SECTION: ANIMATION ENGINE
// Ball animation, node highlighting, step queue.
// To change animation style, modify animateBall() and highlightNode().
// ════════════════════════════════════════════════════════════
let animSteps=[];
let animIdx=0;
let animTimer=null;
let animState='idle';
let liveBalls=[];

function animateBall(container,pathEl,color,reverse){
  const ball=document.createElementNS(NS,'circle');
  ball.setAttribute('r','4');ball.setAttribute('fill',color);ball.setAttribute('filter','url(#glow)');
  const trail=document.createElementNS(NS,'circle');
  trail.setAttribute('r','10');trail.setAttribute('fill',color);trail.setAttribute('opacity','0.15');
  container.appendChild(trail);container.appendChild(ball);
  const len=pathEl.getTotalLength();
  const start=performance.now();
  const entry={ball,trail,done:false};
  liveBalls.push(entry);
  function step(now){
    if(entry.done)return;
    const raw=(now-start)/BALL_MS;
    const t=Math.min(raw,1);
    const ease=t<.5?2*t*t:(1-Math.pow(-2*t+2,2)/2);
    const at=reverse?len*(1-ease):len*ease;
    const pt=pathEl.getPointAtLength(at);
    ball.setAttribute('cx',pt.x);ball.setAttribute('cy',pt.y);
    trail.setAttribute('cx',pt.x);trail.setAttribute('cy',pt.y);
    trail.setAttribute('opacity',String(.2*(1-t)));
    if(t<1){requestAnimationFrame(step)}
    else{
      ball.style.transition='opacity .3s';trail.style.transition='opacity .3s';
      ball.setAttribute('opacity','0');trail.setAttribute('opacity','0');
      setTimeout(()=>{ball.remove();trail.remove();entry.done=true},300);
    }
  }
  requestAnimationFrame(step);
}

function clearBalls(){liveBalls.forEach(b=>{b.done=true;b.ball.remove();b.trail.remove()});liveBalls=[]}

function highlightNode(el,color,bg,stroke,data){
  el.box.setAttribute('fill',bg);el.bdr.setAttribute('stroke',stroke);el.bdr.setAttribute('stroke-width','1.5');
  el.bar.setAttribute('fill',color);el.bar.setAttribute('opacity','.8');
  el.tag.setAttribute('fill',color);el.lbl.setAttribute('fill','#f0f4f8');el.info.setAttribute('fill',color);
  if(data){el.bt.textContent=`+${data.add} -${data.del}`;el.bb.setAttribute('stroke',stroke);el.bdg.setAttribute('opacity','1')}
}

function highlightIndirect(el){
  el.g.classList.remove('dimmed');
  el.bdr.setAttribute('stroke','#475569');el.bdr.setAttribute('stroke-dasharray','4 3');
  el.lbl.setAttribute('fill','#64748b');el.tag.setAttribute('fill','#475569');
}

function highlightEdge(pathEl,color){
  pathEl.setAttribute('stroke',color);pathEl.setAttribute('stroke-width','2.5');
}

// ════════════════════════════════════════════════════════════
// SECTION: BLAST ANALYSIS
// Computes direct + indirect impact, builds animation steps.
// To add new analysis types (config, scaling), add PR type handling here.
// ════════════════════════════════════════════════════════════
let level='arch',activePR=null,activeBtn=null;

function getView(){return level==='arch'?arch:mod}
function getRev(){return level==='arch'?archRev:modRev}
function getData(pr){return level==='arch'?pr.arch:pr.mod}

function resetHighlights(){
  clearBalls();
  [arch,mod].forEach(v=>{
    Object.values(v.nEls).forEach(el=>{
      el.g.classList.remove('dimmed');
      el.box.setAttribute('fill','#0e1420');el.bdr.setAttribute('stroke','#1e2e45');
      el.bdr.setAttribute('stroke-width','1');el.bdr.setAttribute('stroke-dasharray','');
      el.bar.setAttribute('fill','#2a3a55');el.bar.setAttribute('opacity','.5');
      el.tag.setAttribute('fill','#3a5070');el.lbl.setAttribute('fill','#8a99b0');
      el.info.setAttribute('fill','#2a3a50');el.bdg.setAttribute('opacity','0');
      el.bb.setAttribute('stroke','#1e2e45');
    });
    v.eEls.forEach(p=>{p.setAttribute('stroke','#141e30');p.setAttribute('stroke-width','1.2');p.setAttribute('marker-end','url(#arr)')});
  });
}

function buildSteps(pr){
  const view=getView(),rev=getRev(),data=getData(pr);
  if(!data)return[];
  const direct=new Set(Object.keys(data));
  const dist={};direct.forEach(id=>{dist[id]=0});
  const q=[...direct];
  while(q.length){const c=q.shift();for(const d of(rev[c]||[])){if(dist[d]===undefined){dist[d]=dist[c]+1;q.push(d)}}}
  const maxHop=Math.max(...Object.values(dist),0);
  const color=TC[pr.type],bg=TBG[pr.type],stroke=TSK[pr.type];
  const steps=[];
  const allIds=Object.keys(view.nEls);

  steps.push({delay:0,fn:()=>{
    allIds.forEach(id=>{if(dist[id]===undefined)view.nEls[id].g.classList.add('dimmed')});
  }});

  steps.push({delay:300,fn:()=>{
    direct.forEach(cid=>{
      const el=view.nEls[cid];if(!el)return;
      highlightNode(el,color,bg,stroke,data[cid]);
    });
    view.eEls.forEach(p=>{
      if(direct.has(p.dataset.from)&&direct.has(p.dataset.to)){
        highlightEdge(p,color);
      }
    });
  }});

  for(let hop=1;hop<=maxHop;hop++){
    const hopNodes=Object.entries(dist).filter(([,d])=>d===hop).map(([id])=>id);
    const ballDelay=300+hop*HOP_DELAY;
    const nodeDelay=ballDelay+BALL_MS*0.6;

    steps.push({delay:ballDelay,fn:()=>{
      const container=level==='arch'?gArch:gMod;
      view.eEls.forEach(p=>{
        const fd=dist[p.dataset.from],td=dist[p.dataset.to];
        if(fd===undefined||td===undefined)return;
        if(fd===hop&&td===hop-1){
          highlightEdge(p,hop<=1?color:'#475569');
          animateBall(container,p,hop<=1?color:'#64748b',true);
        }
        if(td===hop&&fd===hop-1){
          highlightEdge(p,hop<=1?color:'#475569');
          animateBall(container,p,hop<=1?color:'#64748b',false);
        }
      });
    }});

    steps.push({delay:nodeDelay,fn:()=>{
      hopNodes.forEach(cid=>{
        const el=view.nEls[cid];if(!el)return;
        if(direct.has(cid)){highlightNode(el,color,bg,stroke,data[cid])}
        else{highlightIndirect(el)}
      });
    }});
  }

  const panelDelay=300+((maxHop+1)*HOP_DELAY);
  steps.push({delay:panelDelay,fn:()=>updatePanel(pr,dist,direct)});
  return steps;
}

function playAnimation(){
  if(animState==='playing')return;
  if(animState==='idle'&&activePR){
    resetHighlights();
    animSteps=buildSteps(activePR);
    animIdx=0;
  }
  animState='playing';
  updateControlUI();
  runNextStep();
}

function runNextStep(){
  if(animState!=='playing'||animIdx>=animSteps.length){
    if(animIdx>=animSteps.length)animState='done';
    updateControlUI();return;
  }
  const step=animSteps[animIdx];
  const prev=animIdx>0?animSteps[animIdx-1].delay:0;
  const wait=step.delay-prev;
  animTimer=setTimeout(()=>{
    step.fn();
    animIdx++;
    runNextStep();
  },Math.max(0,wait));
}

function stopAnimation(){
  clearTimeout(animTimer);
  if(animState==='playing')animState='paused';
  updateControlUI();
}

function resetAnimation(){
  clearTimeout(animTimer);
  animState='idle';animSteps=[];animIdx=0;
  resetHighlights();
  closeCodePanel();
  document.getElementById('analysis').style.display='none';
  updateControlUI();
}

function updateControlUI(){
  const play=document.getElementById('btn-play');
  const stop=document.getElementById('btn-stop');
  const reset=document.getElementById('btn-reset');
  play.disabled=animState==='playing'||animState==='done';
  stop.disabled=animState!=='playing';
  reset.disabled=animState==='idle';
  play.classList.toggle('active-ctrl',animState==='playing');
}

document.getElementById('btn-play').onclick=playAnimation;
document.getElementById('btn-stop').onclick=stopAnimation;
document.getElementById('btn-reset').onclick=resetAnimation;

// ════════════════════════════════════════════════════════════
// SECTION: SIDEBAR & PANEL
// PR list rendering, analysis panel, tooltips.
// To add new sidebar sections, modify updatePanel().
// ════════════════════════════════════════════════════════════
let lastPanel=null;
function updatePanel(pr,dist,direct){
  const data=getData(pr);if(!data)return;
  lastPanel={pr,dist,direct};
  const view=getView();
  const indirectSet=new Set(Object.keys(dist).filter(id=>!direct.has(id)));
  const ta=Object.values(data).reduce((s,c)=>s+c.add,0);
  const td=Object.values(data).reduce((s,c)=>s+c.del,0);
  const color=TC[pr.type];

  let html=`<div class="div"></div><div class="lbl">Impact</div>
    <div class="stat-row">
      <div class="stat"><div class="stat-v">${direct.size}</div><div class="stat-u">direct</div></div>
      <div class="stat"><div class="stat-v">${indirectSet.size}</div><div class="stat-u">indirect</div></div>
      <div class="stat"><div class="stat-v">${ta+td}</div><div class="stat-u">lines</div></div>
    </div><div class="div"></div><div class="lbl">Direct Changes</div>`;

  for(const cid of direct){
    const c=data[cid];if(!c)continue;
    const name=view.nMap[cid]?view.nMap[cid].label:cid;
    const canDiff=level==='mod'&&hasCodeDiff(pr,cid);
    const gi=greptileImpact(pr,cid);
    html+=`<div class="ci${canDiff?' has-diff':''}" style="border-left:3px solid ${color}"${canDiff?` onclick="openCodePanel('${cid}')"`:''}>
      <div class="ci-h"><span class="ci-n">${name}${greptileBadge(gi)}</span><span class="ci-b"><span class="a">+${c.add}</span> <span class="d">-${c.del}</span></span></div>
      ${c.files?`<div class="ci-f">${c.files.join(', ')}</div>`:''}
      <div class="ci-s">${c.summary}</div>
      ${canDiff?'<div class="ci-open">view code diff →</div>':''}</div>`;
  }
  if(indirectSet.size>0){
    html+=`<div class="div"></div><div class="lbl">Indirect Impact</div>`;
    for(const cid of indirectSet){
      const name=view.nMap[cid]?view.nMap[cid].label:cid;
      const gi=greptileImpact(pr,cid);
      html+=`<div class="ci indirect"${gi&&(gi.findings||gi.downstream)?' style="opacity:.9;border-color:#3a5070"':''}><div class="ci-n" style="font-size:11px">${name}${greptileBadge(gi)}</div><div class="ci-it">${gi&&gi.downstream?'Greptile: named as downstream impact':'depends on changed components'}</div></div>`;
    }
  }
  html+=greptileSection(pr);
  if(level==='arch'&&pr.mod){
    html+=`<div class="div"></div><div style="text-align:center;padding:4px 0">
      <span style="color:var(--acc);cursor:pointer;font-size:11px;font-family:'Fira Code',monospace" onclick="zoomIn()">zoom into API Gateway ▸</span></div>`;
  }
  document.getElementById('analysis').innerHTML=html;
  document.getElementById('analysis').style.display='block';
}

const prList=document.getElementById('pr-list');
PRS.forEach(pr=>{
  const btn=document.createElement('button');btn.className='pr-btn';
  const ta=pr.arch?Object.values(pr.arch).reduce((s,c)=>s+c.add,0):0;
  const td=pr.arch?Object.values(pr.arch).reduce((s,c)=>s+c.del,0):0;
  btn.innerHTML=`<div class="pr-id"><span class="pt ${pr.type}">${pr.type}</span>${pr.id}</div>
    <div class="pr-title">${pr.title}</div>
    <div class="pr-meta">${pr.author} · +${ta} -${td}</div>`;
  pr._btn=btn;
  btn.addEventListener('click',()=>{
    if(activeBtn)activeBtn.classList.remove('active');
    btn.classList.add('active');activeBtn=btn;
    activePR=pr;
    resetAnimation();
    document.getElementById('controls').style.display='flex';
    playAnimation();
  });
  prList.appendChild(btn);
});

// ════════════════════════════════════════════════════════════
// SECTION: CODE DIFF PANEL
// Final leaf: module → changed file → unified diff.
// ════════════════════════════════════════════════════════════
const codePanel=document.getElementById('code-panel');
const fileTabs=document.getElementById('file-tabs');
const diffMeta=document.getElementById('diff-meta');
const diffView=document.getElementById('diff-view');
let openDiffFiles=[];

function hasCodeDiff(pr,moduleId){
  return Boolean(pr&&CODE_DIFFS[pr.id]&&CODE_DIFFS[pr.id][moduleId]);
}

function closeCodePanel(){
  codePanel.style.display='none';
  openDiffFiles=[];
}

function openCodePanel(moduleId){
  if(level!=='mod'||!activePR)return;
  const node=mod.nMap[moduleId];
  const moduleChange=activePR.mod&&activePR.mod[moduleId];
  openDiffFiles=(CODE_DIFFS[activePR.id]&&CODE_DIFFS[activePR.id][moduleId])||[];

  document.getElementById('code-kicker').textContent=`${activePR.type} ${activePR.id} · FASTIFY`;
  document.getElementById('code-title').textContent=node?node.label:moduleId;
  document.getElementById('code-sub').textContent=moduleChange
    ? moduleChange.summary
    : 'Indirect impact only — this module has no lines changed in the PR';
  codePanel.style.display='flex';

  if(openDiffFiles.length===0){
    fileTabs.style.display='none';
    diffMeta.style.display='none';
    const reason=moduleChange
      ? 'This mock scenario does not have an embedded source patch yet.'
      : 'This module depends on changed code, but the PR does not modify it directly.';
    diffView.innerHTML=`<div class="diff-empty"><div><strong>No direct diff</strong>${reason}</div></div>`;
    return;
  }

  fileTabs.style.display='flex';
  diffMeta.style.display='flex';
  renderDiffFile(0);
}

let openDiffIndex=0;
function renderDiffFile(index){
  const file=openDiffFiles[index];if(!file)return;
  openDiffIndex=index;
  const findings=greptileFindingsFor(activePR,file.file);
  fileTabs.innerHTML='';
  openDiffFiles.forEach((f,i)=>{
    const btn=document.createElement('button');
    btn.className=`file-tab${i===index?' active':''}`;
    btn.textContent=f.file;
    btn.title=f.file;
    btn.onclick=()=>renderDiffFile(i);
    fileTabs.appendChild(btn);
  });

  diffMeta.innerHTML=`<span>${file.file}</span><span class="dm-add">+${file.add}</span><span class="dm-del">-${file.del}</span>${findings.length?`<span class="gr-badge" style="color:${SEV_COLOR[maxSeverity(findings)]}">${findings.length} greptile</span>`:''}<span class="dm-note">focused real hunks</span>`;
  renderDiffRows(file.diff,findings);
}

function renderDiffRows(lines,findings=[]){
  diffView.innerHTML='';
  let oldLine=0,newLine=0;
  lines.forEach(line=>{
    if(line.startsWith('@@')){
      const m=line.match(/^@@ -(\d+)(?:,\d+)? \+(\d+)(?:,\d+)? @@/);
      if(m){oldLine=Number(m[1]);newLine=Number(m[2])}
      const h=document.createElement('div');h.className='diff-row hunk';h.textContent=line;diffView.appendChild(h);return;
    }

    const kind=line.startsWith('+')?'add':line.startsWith('-')?'del':'ctx';
    const row=document.createElement('div');row.className=`diff-row ${kind}`;
    const oldNum=document.createElement('span');oldNum.className='diff-num';
    const newNum=document.createElement('span');newNum.className='diff-num';
    const mark=document.createElement('span');mark.className='diff-mark';
    const code=document.createElement('span');code.className='diff-code';

    if(kind==='add'){newNum.textContent=newLine++;mark.textContent='+'}
    else if(kind==='del'){oldNum.textContent=oldLine++;mark.textContent='−'}
    else{oldNum.textContent=oldLine++;newNum.textContent=newLine++;mark.textContent=' '}
    code.textContent=line.length?line.slice(1):'';
    row.append(oldNum,newNum,mark,code);diffView.appendChild(row);
    if(kind!=='del'){const ln=newLine-1;findings.filter(f=>f.line===ln).forEach(f=>diffView.appendChild(greptileRow(f)))}
  });
  diffView.scrollTop=0;diffView.scrollLeft=0;
}

document.getElementById('code-close').onclick=closeCodePanel;
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeCodePanel()});
MOD_NODES.forEach(n=>mod.nEls[n.id].g.addEventListener('click',()=>{if(level==='mod')openCodePanel(n.id)}));

// ════════════════════════════════════════════════════════════
// SECTION: GREPTILE REVIEW
// Loads reports/<pr>.json (written by scripts/greptile-report.mjs via the
// "Greptile blast-radius report" workflow) and overlays findings on the
// change cards, the diff rows, and the tooltip. Silently no-ops when a report
// is missing or the page is opened over file:// (fetch is blocked there).
// Override the path per PR with `report:'reports/foo.json'`.
// ════════════════════════════════════════════════════════════
const GREPTILE={};
const SEV_COLOR={critical:'#ef4444',high:'#f97316',medium:'#f59e0b',low:'#3b82f6'};
const SEV_RANK=['low','medium','high','critical'];
function esc(t){return String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function md(t){return esc(t).replace(/`([^`]+)`/g,'<code>$1</code>')}
function maxSeverity(fs){return fs.reduce((m,f)=>SEV_RANK.indexOf(f.severity)>SEV_RANK.indexOf(m)?f.severity:m,'low')}
function reportPath(pr){return pr.report||`reports/${String(pr.id).replace('#','')}.json`}
function greptileReport(pr){return pr?GREPTILE[pr.id]:null}
function greptileImpact(pr,nodeId){const r=greptileReport(pr);return r&&r.impact&&r.impact[level]?r.impact[level][nodeId]||null:null}
function greptileBadge(gi){
  if(!gi||!gi.findings)return'';
  const sev=gi.maxSeverity||'low';
  return`<span class="gr-badge" style="color:${SEV_COLOR[sev]}">${gi.findings} · ${sev}</span>`;
}
function samePath(a,b){return a===b||a.endsWith('/'+b)||b.endsWith('/'+a)}
function greptileFindingsFor(pr,file){const r=greptileReport(pr);return r?r.findings.filter(f=>f.path&&samePath(f.path,file)):[]}
function greptileRow(f){
  const el=document.createElement('div');el.className='gr-row';el.style.color=SEV_COLOR[f.severity]||SEV_COLOR.low;
  const body=f.body.replace(/^\s*\[(critical|high|medium|low)\]\s*/i,'');
  el.innerHTML=`<span class="gr-k">greptile · ${esc(f.severity)}</span><span style="color:#b8c4d4">${md(body)}</span>`;
  return el;
}
function greptileSection(pr){
  const r=greptileReport(pr);if(!r)return'';
  const view=getView();
  const sev=r.findings.length?maxSeverity(r.findings):null;
  const downstream=(r.summary&&r.summary.downstream||[]).map(d=>d[level]).filter(Boolean);
  const chips=[...new Set(downstream)].map(id=>`<span class="gr-chip">${esc(view.nMap[id]?view.nMap[id].label:id)}</span>`).join('');
  const firstPara=(r.summary&&r.summary.body||'').split(/\n\s*\n/)[0];
  return`<div class="div"></div><div class="lbl">Greptile Review${sev?`<span class="gr-badge" style="color:${SEV_COLOR[sev]}">${r.findings.length} finding${r.findings.length===1?'':'s'} · ${sev}</span>`:''}</div>
    <div class="gr-src">${esc(r.generatedFrom||'greptile')}</div>
    ${firstPara?`<div class="gr-sum">${md(firstPara)}</div>`:''}
    ${chips?`<div class="ci-it" style="margin-bottom:3px">named downstream</div>${chips}`:''}
    ${r.unmapped&&r.unmapped.length?`<div class="ci-it">unmapped: ${esc(r.unmapped.join(', '))}</div>`:''}`;
}
function markPRButton(pr,r){
  if(!pr._btn||!r.findings.length)return;
  const meta=pr._btn.querySelector('.pr-meta');if(!meta||meta.querySelector('.gr-badge'))return;
  const sev=maxSeverity(r.findings);
  meta.insertAdjacentHTML('beforeend',`<span class="gr-badge" style="color:${SEV_COLOR[sev]}">${r.findings.length} greptile</span>`);
}
async function loadGreptileReports(){
  for(const pr of PRS){
    try{
      const res=await fetch(reportPath(pr),{cache:'no-store'});if(!res.ok)continue;
      const r=await res.json();if(!r||!Array.isArray(r.findings))continue;
      GREPTILE[pr.id]=r;markPRButton(pr,r);
      if(activePR===pr){
        if(lastPanel&&lastPanel.pr===pr&&animState==='done')updatePanel(lastPanel.pr,lastPanel.dist,lastPanel.direct);
        if(codePanel.style.display==='flex'&&openDiffFiles.length)renderDiffFile(openDiffIndex);
      }
    }catch(e){/* no report for this PR, or file:// */}
  }
}
loadGreptileReports();

// ════════════════════════════════════════════════════════════
// SECTION: ZOOM / DRILL-DOWN
// Handles level transitions (architecture ↔ module).
// To add more zoomable services, register them in ARCH_NODES
// with zoomable:true and create matching module data.
// ════════════════════════════════════════════════════════════
const bc0=document.getElementById('bc0'),crumb=document.getElementById('crumb');

function zoomIn(){
  level='mod';
  const gw=arch.nMap['gateway'];
  gArch.style.transformOrigin=`${gw.x}px ${gw.y}px`;
  gArch.style.transform='scale(3.5)';gArch.style.opacity='0';gArch.style.pointerEvents='none';
  setTimeout(()=>{gMod.style.opacity='1';gMod.style.pointerEvents='auto'},250);
  bc0.classList.add('click');bc0.classList.remove('on');bc0.onclick=zoomOut;
  if(!document.getElementById('bc1')){
    const sep=document.createElement('span');sep.className='bcsep';sep.textContent='›';sep.id='bcsep';crumb.appendChild(sep);
    const b=document.createElement('span');b.className='bc on';b.id='bc1';b.textContent='API Gateway';crumb.appendChild(b);
  }
  document.getElementById('vsub').textContent='fastify · 9 modules';
  if(activePR){resetAnimation();playAnimation()}
}

function zoomOut(){
  closeCodePanel();
  level='arch';
  gMod.style.opacity='0';gMod.style.pointerEvents='none';
  setTimeout(()=>{gArch.style.transform='scale(1)';gArch.style.opacity='1';gArch.style.pointerEvents='auto'},200);
  bc0.classList.remove('click');bc0.classList.add('on');bc0.onclick=null;
  const s=document.getElementById('bcsep'),b=document.getElementById('bc1');if(s)s.remove();if(b)b.remove();
  document.getElementById('vsub').textContent='e-commerce · 13 components';
  if(activePR){resetAnimation();playAnimation()}
}

ARCH_NODES.forEach(n=>{if(n.zoomable)arch.nEls[n.id].g.addEventListener('click',()=>{if(level==='arch')zoomIn()})});

// ════════════════════════════════════════════════════════════
// SECTION: TOOLTIP & PAN
// ════════════════════════════════════════════════════════════
const tip=document.getElementById('tip');
function showTip(e,n){
  let h=`<div class="tip-n">${n.label}</div>`;
  if(n.zoomable)h+=`<div class="tip-f">click to explore modules</div>`;
  if(level==='mod'&&hasCodeDiff(activePR,n.id))h+=`<div class="tip-f">click to inspect code diff</div>`;
  if(activePR){const d=getData(activePR);if(d&&d[n.id])h+=`<div class="tip-s">${d[n.id].summary}</div>`;
    const gi=greptileImpact(activePR,n.id);if(gi&&(gi.findings||gi.downstream))h+=`<div class="tip-f" style="color:${SEV_COLOR[gi.maxSeverity||'low']}">greptile: ${gi.findings?`${gi.findings} finding${gi.findings===1?'':'s'} · ${gi.maxSeverity}`:'named as downstream impact'}</div>`}
  tip.innerHTML=h;tip.style.display='block';tip.style.left=(e.clientX+14)+'px';tip.style.top=(e.clientY-8)+'px';
}
function hideTip(){tip.style.display='none'}
document.addEventListener('mousemove',e=>{if(tip.style.display==='block'){tip.style.left=(e.clientX+14)+'px';tip.style.top=(e.clientY-8)+'px'}});

let pan={x:0,y:0},panning=false,ps=null;
svg.addEventListener('mousedown',e=>{if(!e.target.closest('.node-group')){panning=true;ps={x:e.clientX-pan.x,y:e.clientY-pan.y}}});
svg.addEventListener('mousemove',e=>{if(panning){pan.x=e.clientX-ps.x;pan.y=e.clientY-ps.y;const g=level==='arch'?gArch:gMod;g.style.transform=level==='arch'?`translate(${pan.x}px,${pan.y}px) scale(1)`:`translate(${pan.x}px,${pan.y}px)`}});
svg.addEventListener('mouseup',()=>{panning=false});
svg.addEventListener('mouseleave',()=>{panning=false});
</script>
