<!DOCTYPE html>
<html lang="en">
<head>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fira+Code:wght@400;500&display=swap">
<style>

*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--tx);font-family:'DM Sans',system-ui,sans-serif;overflow:hidden;height:100vh}
#crumb{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:20;display:flex;align-items:center;gap:6px;font-family:'Fira Code',monospace;font-size:14px;background:var(--sf);border:1px solid var(--bd);border-radius:5px;padding:7px 16px}
.bc{color:var(--txd);cursor:default}.bc.click{color:var(--acc);cursor:pointer}.bc.click:hover{color:var(--txb)}.bc.on{color:var(--txb)}.bcsep{color:var(--txd)}
#sidebar{position:fixed;top:12px;left:12px;width:280px;background:var(--sf);border:1px solid var(--bd);border-radius:6px;padding:14px;z-index:10;font-size:15px;max-height:calc(100vh - 24px);overflow-y:auto}
#sidebar::-webkit-scrollbar{width:3px}#sidebar::-webkit-scrollbar-thumb{background:var(--bd);border-radius:2px}
#sidebar h1{font-size:22px;font-weight:700;color:var(--txb);margin-bottom:2px}
.sub{color:var(--txd);font-size:13px;font-family:'Fira Code',monospace;margin-bottom:10px}
.div{height:1px;background:var(--bd);margin:8px 0}
.lbl{font-size:13px;font-weight:600;color:var(--txd);letter-spacing:1px;text-transform:uppercase;margin-bottom:5px;font-family:'Fira Code',monospace}
.pr-btn{display:block;width:100%;text-align:left;background:#0a0f18;border:1px solid var(--bd);border-radius:5px;padding:8px 10px;margin-bottom:5px;cursor:pointer;font-family:inherit;font-size:14px;color:var(--tx);transition:border-color .2s,background .2s}
.pr-btn:hover{border-color:#2a3a55;background:#0e1520}.pr-btn.active{border-color:var(--acc);background:#0c1a2e}
.pr-id{font-family:'Fira Code',monospace;font-size:13px;color:var(--txd)}
.pr-title{color:var(--txb);font-weight:500;margin-top:2px;font-size:16px}
.pr-meta{font-size:12px;color:var(--txd);margin-top:2px;font-family:'Fira Code',monospace}
.pt{display:inline-block;padding:2px 7px;border-radius:3px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-right:3px}
.pt.feat{background:#052e16;color:var(--grn)}.pt.fix{background:#2a1a05;color:var(--amb)}.pt.refactor{background:#0f1d3d;color:var(--blu)}
.stat-row{display:flex;gap:10px;margin-bottom:6px}.stat{text-align:center;flex:1}
.stat-v{font-size:28px;font-weight:700;color:var(--txb);line-height:1}.stat-u{font-size:12px;color:var(--txd);font-family:'Fira Code',monospace}
#analysis{display:none}
.ci{background:#0a0f18;border:1px solid var(--bd);border-radius:5px;padding:8px 10px;margin-bottom:5px}
.ci.indirect{border-style:dashed;opacity:.7}
.ci-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:2px}
.ci-n{font-weight:600;color:var(--txb);font-size:15px}
.ci-b{font-family:'Fira Code',monospace;font-size:12px}.ci-b .a{color:var(--grn)}.ci-b .d{color:var(--red)}
.ci-f{font-size:13px;color:var(--txd);font-family:'Fira Code',monospace;line-height:1.5}
.ci-s{font-size:13px;color:var(--tx);margin-top:3px;line-height:1.3;font-style:italic}

#controls{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:20;display:none;align-items:center;gap:8px;background:var(--sf);border:1px solid var(--bd);border-radius:6px;padding:6px 10px}
#controls button{background:#0a0f18;border:1px solid var(--bd);color:var(--tx);padding:5px 14px;border-radius:4px;font-family:'Fira Code',monospace;font-size:13px;cursor:pointer;transition:all .15s;white-space:nowrap}

.node-group.dimmed .node-box{fill:#080c12!important}.node-group.dimmed .node-border{stroke:#101820!important}
.node-group.dimmed .node-tag{fill:#1a2535!important}.node-group.dimmed .node-label{fill:#2a3a4a!important}.node-group.dimmed .node-info{fill:#101820!important}

<script>

const RAW={
'fastify.js':['lib/content-type-parser.js','lib/context.js','lib/decorate.js','lib/error-handler.js','lib/errors.js','lib/four-oh-four.js','lib/hooks.js','lib/initial-config-validation.js','lib/logger-factory.js','lib/plugin-override.js','lib/plugin-utils.js','lib/reply.js','lib/req-id-gen-factory.js','lib/request.js','lib/route.js','lib/schema-controller.js','lib/server.js','lib/symbols.js'],

'lib/error-handler.js':['lib/error-serializer.js','lib/error-status.js','lib/errors.js','lib/schemas.js','lib/symbols.js','lib/wrap-thenable.js'],
'lib/error-serializer.js':[],'lib/error-status.js':['lib/symbols.js'],'lib/errors.js':[],
'lib/four-oh-four.js':['lib/context.js','lib/error-handler.js','lib/errors.js','lib/hooks.js','lib/logger-factory.js','lib/reply.js','lib/req-id-gen-factory.js','lib/request.js','lib/symbols.js'],
'lib/handle-request.js':['lib/content-type.js','lib/error-status.js','lib/errors.js','lib/hooks.js','lib/symbols.js','lib/validation.js','lib/wrap-thenable.js'],
'lib/head-route.js':[],'lib/hooks.js':['lib/errors.js','lib/symbols.js'],

'lib/plugin-utils.js':['lib/decorate.js','lib/errors.js','lib/symbols.js'],
'lib/reply.js':['lib/content-type.js','lib/decorate.js','lib/error-handler.js','lib/errors.js','lib/handle-request.js','lib/hooks.js','lib/logger-factory.js','lib/schemas.js','lib/symbols.js'],

'lib/route.js':['lib/context.js','lib/error-handler.js','lib/errors.js','lib/handle-request.js','lib/head-route.js','lib/hooks.js','lib/initial-config-validation.js','lib/logger-factory.js','lib/req-id-gen-factory.js','lib/schemas.js','lib/symbols.js','lib/validation.js'],
'lib/schema-controller.js':['lib/schemas.js'],
'lib/schemas.js':['lib/content-type.js','lib/errors.js','lib/symbols.js'],
'lib/server.js':['lib/errors.js','lib/hooks.js','lib/noop-set.js','lib/symbols.js','lib/warnings.js'],
'lib/symbols.js':[],'lib/validation.js':['lib/errors.js','lib/symbols.js','lib/warnings.js'],
'lib/warnings.js':[],'lib/wrap-thenable.js':['lib/error-status.js','lib/symbols.js']
};

// ═══════════════════════════════════════════════════════
// MODULE DEFINITIONS — grouped from real file structure

const MODULES={
  core:{label:'Core',tag:'ENTRY',files:['fastify.js']},
  plugins:{label:'Plugins',tag:'EXTENSION',files:['lib/plugin-override.js','lib/plugin-utils.js']},
  server:{label:'Server & Hooks',tag:'LIFECYCLE',files:['lib/server.js','lib/hooks.js']},
  routing:{label:'Routing',tag:'HTTP',files:['lib/route.js','lib/four-oh-four.js','lib/handle-request.js','lib/head-route.js','lib/context.js']},
  reqres:{label:'Request / Reply',tag:'I/O',files:['lib/reply.js','lib/request.js','lib/content-type-parser.js','lib/content-type.js']},
  validation:{label:'Validation',tag:'SCHEMA',files:['lib/validation.js','lib/schemas.js','lib/schema-controller.js','lib/initial-config-validation.js']},
  errors:{label:'Error Handling',tag:'ERRORS',files:['lib/error-handler.js','lib/error-serializer.js','lib/error-status.js','lib/errors.js']},
  logging:{label:'Logging',tag:'OBSERVABILITY',files:['lib/logger-factory.js','lib/logger-pino.js','lib/log-controller.js']},
  internals:{label:'Internals',tag:'SHARED',files:['lib/symbols.js','lib/wrap-thenable.js','lib/warnings.js','lib/noop-set.js','lib/decorate.js','lib/req-id-gen-factory.js','lib/config-validator.js']},
};
const fileToMod={};
for(const[m,d]of Object.entries(MODULES))for(const f of d.files)fileToMod[f]=m;

// compute ALL module-level edges from real imports
const _es=new Set();const ALL_MOD_EDGES=[];
for(const[file,imports]of Object.entries(RAW)){
  const fm=fileToMod[file];if(!fm)continue;
  for(const imp of imports){const tm=fileToMod[imp];if(!tm||tm===fm)continue;const k=fm+'>'+tm;if(!_es.has(k)){_es.add(k);ALL_MOD_EDGES.push([fm,tm])}}
}

// SHOWN EDGES: structural deps (hide utility deps to errors/internals, hide core→* starburst)
const SHOWN_EDGES=ALL_MOD_EDGES.filter(([f,t])=>t!=='errors'&&t!=='internals'&&f!=='core');
SHOWN_EDGES.unshift(['core','routing'],['core','server'],['core','plugins']);
const shownSet=new Set(SHOWN_EDGES.map(([f,t])=>f+'>'+t));
const bidiSet=new Set();
SHOWN_EDGES.forEach(([f,t])=>{if(shownSet.has(t+'>'+f)){bidiSet.add(f+'>'+t);bidiSet.add(t+'>'+f)}});

// MODULE NODE POSITIONS
const MOD_NODES=[
  {id:'core',label:'Core',tag:'ENTRY',x:CX,y:80,info:'imports all modules · 1 file'},
  {id:'plugins',label:'Plugins',tag:'EXTENSION',x:CX-220,y:220,info:'2 files'},
  {id:'server',label:'Server & Hooks',tag:'LIFECYCLE',x:CX,y:220,info:'2 files'},
  {id:'routing',label:'Routing',tag:'HTTP',x:CX+220,y:220,info:'5 files'},
  {id:'reqres',label:'Request / Reply',tag:'I/O',x:CX-130,y:360,info:'4 files'},
  {id:'validation',label:'Validation',tag:'SCHEMA',x:CX+130,y:360,info:'4 files'},
  {id:'logging',label:'Logging',tag:'OBSERVABILITY',x:CX-220,y:500,info:'3 files'},
  {id:'errors',label:'Error Handling',tag:'ERRORS',x:CX,y:500,info:'used by 7 modules · 4 files'},
  {id:'internals',label:'Internals',tag:'SHARED',x:CX+220,y:500,info:'used by 8 modules · 7 files'},
];

// ═══════════════════════════════════════════════════════
// PR DEFINITIONS — all real Fastify files
// ═══════════════════════════════════════════════════════
const PRS=[
  {id:'#6580',title:'rename kRouteContext symbol',type:'refactor',author:'intern',
   oneliner:'A harmless 3-line rename in symbols.js — but this Symbol is imported by 17 files across every single module. Did all consumers get updated?',
   files:{'lib/symbols.js':{add:3,del:3,summary:'Rename kRouteContext → kRouteCtx'}}},
  {id:'#4533',title:'fix error serialization for nested errors',type:'fix',author:'dave',
   oneliner:'Nested errors were losing their stack traces during serialization — fixes the recursive handler to walk Error.cause chains.',
   files:{'lib/error-handler.js':{add:15,del:8,summary:'Fix recursive error handling for nested causes'},
          'lib/error-serializer.js':{add:22,del:5,summary:'Preserve stack traces in Error.cause chains'}}},
  {id:'#4521',title:'add content-type negotiation',type:'feat',author:'alice',
   oneliner:'Adds content negotiation so the server handles Accept headers and responds with the right format automatically.',
   files:{'lib/content-type-parser.js':{add:34,del:12,summary:'Parse Accept headers with quality values'},
          'lib/content-type.js':{add:18,del:3,summary:'Add MIME type matching and ranking'},
          'lib/reply.js':{add:8,del:2,summary:'Use negotiated type in response serialization'}}},
  {id:'#4510',title:'lazy schema compilation',type:'refactor',author:'carol',
   oneliner:'Schemas are now compiled on first use instead of at startup — cuts boot time for apps with many routes.',
   files:{'lib/schemas.js':{add:45,del:30,summary:'Lazy compilation with LRU cache'},
          'lib/schema-controller.js':{add:28,del:15,summary:'Deferred schema resolution API'},
          'lib/validation.js':{add:32,del:20,summary:'Cache compiled validators per route'}}},
];

// ═══════════════════════════════════════════════════════
// SVG SETUP
// ═══════════════════════════════════════════════════════
const svg=document.getElementById('g');
svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
const defs=document.createElementNS(NS,'defs');
const mkr=document.createElementNS(NS,'marker');
mkr.setAttribute('id','arr');mkr.setAttribute('viewBox','0 0 8 6');
mkr.setAttribute('refX','8');mkr.setAttribute('refY','3');mkr.setAttribute('markerWidth','7');mkr.setAttribute('markerHeight','5');mkr.setAttribute('orient','auto');
const ap=document.createElementNS(NS,'path');ap.setAttribute('d','M0,.5 L7,3 L0,5.5');ap.setAttribute('fill','#2a3a55');
mkr.appendChild(ap);defs.appendChild(mkr);
const glow=document.createElementNS(NS,'filter');glow.setAttribute('id','glow');

// ═══════════════════════════════════════════════════════
// GRAPH RENDERING
// ═══════════════════════════════════════════════════════
function makePath(a,b,off){
  off=off||0;
  const dx=b.x-a.x,dy=b.y-a.y;
  if(Math.abs(dy)<NH+20){
    const sx=dx>0?a.x+NW/2:a.x-NW/2;
    const ex=dx>0?b.x-NW/2-6:b.x+NW/2+6;
    const my=(a.y+b.y)/2-20+off;
    return`M${sx},${a.y+off} Q${(sx+ex)/2},${my} ${ex},${b.y+off}`;
  }
  const goDown=dy>0;
  const sy=goDown?a.y+NH/2:a.y-NH/2;
  const ey=goDown?b.y-NH/2-6:b.y+NH/2+6;
  const cdy=ey-sy;
  return`M${a.x+off},${sy} C${a.x+off},${sy+cdy*.45} ${b.x+off},${ey-cdy*.45} ${b.x+off},${ey}`;
}

function renderGraph(nodes,edges,container,opts){
  opts=opts||{};
  container.innerHTML='';
  const nMap={};nodes.forEach(n=>nMap[n.id]=n);
  const eEls=edges.map(([fid,tid])=>{
    if(!nMap[fid]||!nMap[tid])return null;
    const isBidi=opts.bidiSet&&opts.bidiSet.has(fid+'>'+tid);
    const off=isBidi?(fid<tid?12:-12):0;
    const p=document.createElementNS(NS,'path');
    p.setAttribute('d',makePath(nMap[fid],nMap[tid],off));
    p.setAttribute('class','edge-path');p.setAttribute('marker-end','url(#arr)');
    p.dataset.from=fid;p.dataset.to=tid;
    container.appendChild(p);return p;
  }).filter(Boolean);
  const nEls={};
  nodes.forEach(n=>{
    const g=document.createElementNS(NS,'g');g.setAttribute('class','node-group');
    g.setAttribute('transform',`translate(${n.x},${n.y})`);g.dataset.id=n.id;
    const box=document.createElementNS(NS,'rect');
    box.setAttribute('x',-NW/2);box.setAttribute('y',-NH/2);box.setAttribute('width',NW);box.setAttribute('height',NH);
    box.setAttribute('rx',NR);box.setAttribute('fill','#0e1420');box.setAttribute('class','node-box');g.appendChild(box);
    const bdr=document.createElementNS(NS,'rect');
    bdr.setAttribute('x',-NW/2);bdr.setAttribute('y',-NH/2);bdr.setAttribute('width',NW);bdr.setAttribute('height',NH);
    bdr.setAttribute('rx',NR);bdr.setAttribute('fill','none');bdr.setAttribute('stroke','#1e2e45');bdr.setAttribute('stroke-width','1');
    bdr.setAttribute('class','node-border');g.appendChild(bdr);
    const bar=document.createElementNS(NS,'rect');
    bar.setAttribute('x',-NW/2+2);bar.setAttribute('y',-NH/2+5);bar.setAttribute('width',3);bar.setAttribute('height',NH-10);
    bar.setAttribute('rx',1);bar.setAttribute('fill','#2a3a55');bar.setAttribute('opacity','.5');bar.setAttribute('class','node-bar');g.appendChild(bar);

    let tagEl=null,infoEl=null;
    if(n.tag){
      tagEl=document.createElementNS(NS,'text');tagEl.textContent=n.tag;
      tagEl.setAttribute('x',-NW/2+14);tagEl.setAttribute('y',-NH/2+16);tagEl.setAttribute('fill','#6a8aaa');
      tagEl.setAttribute('font-size','13');tagEl.setAttribute('font-family',"'Fira Code',monospace");
      tagEl.setAttribute('letter-spacing','.6');tagEl.setAttribute('class','node-tag');g.appendChild(tagEl);
    }
    const lbl=document.createElementNS(NS,'text');lbl.textContent=n.label;
    lbl.setAttribute('x',-NW/2+14);lbl.setAttribute('y',n.tag?-NH/2+34:5);
    lbl.setAttribute('fill','#d0dce8');lbl.setAttribute('font-size',n.tag?'18':'15');
    lbl.setAttribute('font-family',"'DM Sans',sans-serif");lbl.setAttribute('font-weight','600');
    lbl.setAttribute('class','node-label');g.appendChild(lbl);

    if(n.info){
      infoEl=document.createElementNS(NS,'text');infoEl.textContent=n.info;
      infoEl.setAttribute('x',-NW/2+14);infoEl.setAttribute('y',-NH/2+48);infoEl.setAttribute('fill','#5a7a98');
      infoEl.setAttribute('font-size','13');infoEl.setAttribute('font-family',"'Fira Code',monospace");
      infoEl.setAttribute('class','node-info');g.appendChild(infoEl);
    }
    if(opts.zoomable!==false&&n.tag){
      const zh=document.createElementNS(NS,'text');zh.textContent='EXPLORE ▸';
      zh.setAttribute('x',NW/2-8);zh.setAttribute('y',-NH/2+48);zh.setAttribute('text-anchor','end');
      zh.setAttribute('class','zoom-hint');g.appendChild(zh);g.style.cursor='zoom-in';
    }

    bdg.setAttribute('transform',`translate(${NW/2-8},${-NH/2-6})`);

    nEls[n.id]={g,box,bdr,bar,tag:tagEl,lbl,info:infoEl,bdg,bb,bt};
  });
  return{nEls,eEls,nMap};
}

let animSteps=[],animIdx=0,animTimer=null,animState='idle',liveBalls=[];

function animateBall(container,pathEl,color,reverse,labelText){
  const g=document.createElementNS(NS,'g');
  g.setAttribute('pointer-events','none');
  const trail=document.createElementNS(NS,'circle');
  trail.setAttribute('r','14');trail.setAttribute('fill',color);trail.setAttribute('opacity','0.10');
  const ball=document.createElementNS(NS,'circle');
  ball.setAttribute('r','5');ball.setAttribute('fill',color);ball.setAttribute('filter','url(#glow)');
  g.appendChild(trail);g.appendChild(ball);
  if(labelText){
    const bg=document.createElementNS(NS,'rect');
    bg.setAttribute('rx','4');bg.setAttribute('ry','4');bg.setAttribute('fill','#1a2030');
    bg.setAttribute('fill-opacity','0.85');bg.setAttribute('stroke',color);bg.setAttribute('stroke-width','0.8');
    bg.setAttribute('stroke-opacity','0.6');
    const lbl=document.createElementNS(NS,'text');
    lbl.textContent=labelText;lbl.setAttribute('fill',color);lbl.setAttribute('font-size','12');
    lbl.setAttribute('font-family',"'Fira Code',monospace");lbl.setAttribute('font-weight','bold');
    lbl.setAttribute('text-anchor','middle');lbl.setAttribute('dominant-baseline','auto');
    g.appendChild(bg);g.appendChild(lbl);
    g._lbl=lbl;g._bg=bg;
  }
  container.appendChild(g);
  const len=pathEl.getTotalLength();const start=performance.now();
  const entry={g,done:false};liveBalls.push(entry);
  let measured=false;
  function step(now){
    if(entry.done)return;
    const t=Math.min((now-start)/BALL_MS,1);
    const ease=t<.5?2*t*t:(1-Math.pow(-2*t+2,2)/2);
    const at=reverse?len*(1-ease):len*ease;
    const pt=pathEl.getPointAtLength(at);
    ball.setAttribute('cx',pt.x);ball.setAttribute('cy',pt.y);
    trail.setAttribute('cx',pt.x);trail.setAttribute('cy',pt.y);
    trail.setAttribute('opacity',String(.15*(1-t)));
    if(g._lbl){
      g._lbl.setAttribute('x',pt.x);g._lbl.setAttribute('y',pt.y-14);
      if(!measured){measured=true;try{
        const bb=g._lbl.getBBox();
        g._bg.setAttribute('x',bb.x-4);g._bg.setAttribute('y',bb.y-2);
        g._bg.setAttribute('width',bb.width+8);g._bg.setAttribute('height',bb.height+4);
      }catch(e){}}
      else if(g._bg.getAttribute('width')){
        const bw=+g._bg.getAttribute('width'),bh=+g._bg.getAttribute('height');
        g._bg.setAttribute('x',pt.x-bw/2);g._bg.setAttribute('y',pt.y-14-bh+2);
      }
    }
    if(t<1)requestAnimationFrame(step);
    else{
      const pt2=pathEl.getPointAtLength(reverse?0:len);
      const ripple=document.createElementNS(NS,'circle');
      ripple.setAttribute('cx',pt2.x);ripple.setAttribute('cy',pt2.y);
      ripple.setAttribute('r','6');ripple.setAttribute('fill','none');
      ripple.setAttribute('stroke',color);ripple.setAttribute('stroke-width','2');
      ripple.setAttribute('opacity','0.8');
      ripple.style.transition='all .5s ease-out';
      container.appendChild(ripple);
      requestAnimationFrame(()=>{ripple.setAttribute('r','22');ripple.setAttribute('opacity','0')});
      setTimeout(()=>ripple.remove(),600);
      g.style.transition='opacity .3s';g.setAttribute('opacity','0');
      setTimeout(()=>{g.remove();entry.done=true},300)}
  }
  requestAnimationFrame(step);
}
function clearBalls(){liveBalls.forEach(b=>{b.done=true;b.g.remove()});liveBalls=[]}

function highlightNode(el,color,bg,stroke,data){

// ═══════════════════════════════════════════════════════
// BLAST COMPUTATION
// ═══════════════════════════════════════════════════════
let level='mod',zoomedMod=null,activePR=null,activeBtn=null;
let fileGraph=null,fileDist=null,modDist=null,modData=null,lastDist=null;
let fileParent={},modCause={};

function buildReverse(edges){const r={};edges.forEach(([f,t])=>{if(!r[t])r[t]=[];r[t].push(f)});return r}
const allModRev=buildReverse(ALL_MOD_EDGES);

function computeBlast(pr){
  if(!pr){fileDist=null;modDist=null;modData=null;fileParent={};modCause={};return}
  modData={};
  for(const[f,info]of Object.entries(pr.files)){
    const m=fileToMod[f];if(!m)continue;
    if(!modData[m])modData[m]={files:[],add:0,del:0,summary:''};
    modData[m].files.push(f.replace('lib/','').replace('.js',''));
    modData[m].add+=info.add;modData[m].del+=info.del;
    if(!modData[m].summary)modData[m].summary=info.summary;
  }
  // file-level BFS on full graph
  const allFileEdges=[];
  for(const[file,imports]of Object.entries(RAW))for(const imp of imports)allFileEdges.push([file,imp]);
  const fileRev=buildReverse(allFileEdges);
  fileDist={};fileParent={};
  const seeds=Object.keys(pr.files);
  seeds.forEach(f=>{fileDist[f]=0});
  const q=[...seeds];
  while(q.length){const c=q.shift();for(const d of(fileRev[c]||[]))if(fileDist[d]===undefined){fileDist[d]=fileDist[c]+1;fileParent[d]=c;q.push(d)}}
  // module distances + cause tracking
  modDist={};modCause={};
  for(const[f,d]of Object.entries(fileDist)){
    const m=fileToMod[f];if(!m)continue;
    if(modDist[m]===undefined||d<modDist[m]){modDist[m]=d;if(fileParent[f])modCause[m]=fileParent[f]}
  }
}

function getView(){return level==='mod'?modGraph:fileGraph}
function getContainer(){return level==='mod'?gMod:gFiles}

function buildSteps(pr){
  computeBlast(pr);
  const view=getView();if(!view)return[];
  const container=getContainer();
  let dist,data,direct;
  if(level==='mod'){
    dist=modDist||{};data=modData||{};direct=new Set(Object.keys(data));
  }else{
    const mf=new Set(MODULES[zoomedMod].files);
    dist={};for(const[f,d]of Object.entries(fileDist||{}))if(mf.has(f))dist[f]=d;
    data={};for(const[f,info]of Object.entries(pr.files))if(mf.has(f))data[f]=info;
    direct=new Set(Object.keys(data));
  }
  if(!Object.keys(dist).length)return[];
  lastDist=dist;
  const maxHop=Math.max(...Object.values(dist),0);
  const color=TC[pr.type],bg=TBG[pr.type],stroke=TSK[pr.type];
  const steps=[],allIds=Object.keys(view.nEls);

  steps.push({delay:0,fn:()=>{allIds.forEach(id=>{if(dist[id]===undefined)view.nEls[id].g.classList.add('dimmed')})}});
  steps.push({delay:300,fn:()=>{
    direct.forEach(cid=>{const el=view.nEls[cid];if(!el)return;
      highlightNode(el,color,bg,stroke,data[cid]);
      const n=view.nMap[cid];if(n){
        const lbl=level==='mod'&&data[cid].files?'✎ '+data[cid].files.join(', '):'✎ changed';
        showImpactTag(container,n,lbl,color);
      }
    });
    view.eEls.forEach(p=>{if(direct.has(p.dataset.from)&&direct.has(p.dataset.to))highlightEdge(p,color)});
  }});

  for(let hop=1;hop<=maxHop;hop++){
    const hopNodes=Object.entries(dist).filter(([id,d])=>d===hop&&view.nEls[id]).map(([id])=>id);
    if(!hopNodes.length)continue;
    const ballDelay=300+hop*HOP_DELAY,nodeDelay=ballDelay+BALL_MS*.6;
    steps.push({delay:ballDelay,fn:()=>{
      view.eEls.forEach(p=>{
        const fd=dist[p.dataset.from],td=dist[p.dataset.to];
        if(fd===undefined||td===undefined)return;
        if((fd===hop&&td===hop-1)||(td===hop&&fd===hop-1)){
          highlightEdge(p,hop<=1?color:'#475569');
          const srcId=fd===hop?p.dataset.from:p.dataset.to;
          const dstId=fd===hop?p.dataset.to:p.dataset.from;
          const srcN=view.nMap[srcId],dstN=view.nMap[dstId];
          const srcLabel=srcN?(srcN.label||srcId).replace(/^lib\//,''):'';
          const dstLabel=dstN?(dstN.label||dstId).replace(/^lib\//,''):'';
          const ballLabel=srcLabel+' → '+dstLabel;
          animateBall(container,p,hop<=1?color:'#64748b',fd===hop,ballLabel);
        }
      });
    }});
    steps.push({delay:nodeDelay,fn:()=>{
      hopNodes.forEach(cid=>{const el=view.nEls[cid];if(!el)return;
        if(direct.has(cid)){highlightNode(el,color,bg,stroke,data[cid])}else{
          highlightIndirect(el);
          const n=view.nMap[cid];if(n){
            const cause=level==='mod'?modCause[cid]:fileParent[cid];
            const tag=cause?'← imports '+cause.replace(/^lib\//,''):'← indirect';
            showImpactTag(container,n,tag,'#f0c060');
          }
        }});
    }});
  }
  if(level==='mod'){
    steps.push({delay:300+((maxHop+1)*HOP_DELAY),fn:()=>updatePanel(pr,dist,direct)});
  }
  return steps;
}

function resetHighlights(){
  clearBalls();clearImpactTags();
  [modGraph,fileGraph].forEach(v=>{if(!v)return;
    Object.values(v.nEls).forEach(el=>{
      el.g.classList.remove('dimmed');
      el.box.setAttribute('fill','#0e1420');el.bdr.setAttribute('stroke','#1e2e45');
      el.bdr.setAttribute('stroke-width','1');el.bdr.setAttribute('stroke-dasharray','');
      el.bar.setAttribute('fill','#2a3a55');el.bar.setAttribute('opacity','.5');
      if(el.tag)el.tag.setAttribute('fill','#6a8aaa');el.lbl.setAttribute('fill','#d0dce8');
      if(el.info)el.info.setAttribute('fill','#5a7a98');
      el.bdg.setAttribute('opacity','0');el.bb.setAttribute('stroke','#1e2e45');
    });
    v.eEls.forEach(p=>{p.setAttribute('stroke','#1e2e48');p.setAttribute('stroke-width','1.2')});
  });
}

function playAnimation(){
  if(animState==='playing')return;
  if(animState==='idle'&&activePR){resetHighlights();animSteps=buildSteps(activePR);animIdx=0}
  animState='playing';updateControlUI();runNextStep();
}
function runNextStep(){
  if(animState!=='playing'||animIdx>=animSteps.length){if(animIdx>=animSteps.length)animState='done';updateControlUI();return}
  const step=animSteps[animIdx],prev=animIdx>0?animSteps[animIdx-1].delay:0;
  animTimer=setTimeout(()=>{step.fn();animIdx++;runNextStep()},Math.max(0,step.delay-prev));
}
function stopAnimation(){clearTimeout(animTimer);if(animState==='playing')animState='paused';updateControlUI()}
function resetAnimation(){
  clearTimeout(animTimer);animState='idle';animSteps=[];animIdx=0;lastDist=null;
  resetHighlights();
  document.getElementById('analysis').style.display='none';
  document.getElementById('pr-banner').style.display='none';
  hideDetail();updateControlUI();
}
function updateControlUI(){
  const p=document.getElementById('btn-play'),s=document.getElementById('btn-stop'),r=document.getElementById('btn-reset');
  p.disabled=animState==='playing'||animState==='done';
  s.disabled=animState!=='playing';r.disabled=animState==='idle';
  p.classList.toggle('active-ctrl',animState==='playing');
}
document.getElementById('btn-play').onclick=playAnimation;
document.getElementById('btn-stop').onclick=stopAnimation;
document.getElementById('btn-reset').onclick=resetAnimation;

function updatePanel(pr,dist,direct){
  if(!modData)return;
  const indirectSet=new Set(Object.keys(dist).filter(id=>!direct.has(id)&&modGraph.nEls[id]));
  const ta=Object.values(modData).reduce((s,c)=>s+c.add,0);
  const td=Object.values(modData).reduce((s,c)=>s+c.del,0);
  const color=TC[pr.type];
  let html=`<div class="div"></div><div class="lbl">Impact</div>
    <div class="stat-row">
      <div class="stat"><div class="stat-v">${direct.size}</div><div class="stat-u">direct</div></div>
      <div class="stat"><div class="stat-v">${indirectSet.size}</div><div class="stat-u">indirect</div></div>
      <div class="stat"><div class="stat-v">${ta+td}</div><div class="stat-u">lines</div></div>
    </div><div class="div"></div><div class="lbl">Direct Changes</div>`;
  for(const cid of direct){
    const c=modData[cid];if(!c)continue;
    const name=modGraph.nMap[cid]?modGraph.nMap[cid].label:cid;
    html+=`<div class="ci" style="border-left:3px solid ${color}">
      <div class="ci-h"><span class="ci-n">${name}</span><span class="ci-b"><span class="a">+${c.add}</span> <span class="d">-${c.del}</span></span></div>
      <div class="ci-f">${c.files.join(', ')}</div>
      ${c.summary?`<div class="ci-s">${c.summary}</div>`:''}
      <div style="margin-top:4px"><span style="color:var(--acc);cursor:pointer;font-size:11px;font-family:'Fira Code',monospace" onclick="zoomToFiles('${cid}')">explore files ▸</span></div>
    </div>`;
  }
  if(indirectSet.size>0){
    html+=`<div class="div"></div><div class="lbl">Indirect Impact</div>`;
    for(const cid of indirectSet){
      const name=modGraph.nMap[cid]?modGraph.nMap[cid].label:cid;
      const hop=dist[cid];
      html+=`<div class="ci indirect"><div class="ci-n" style="font-size:12px">${name}</div><div class="ci-it">${hop} hop${hop>1?'s':''} from change</div></div>`;
    }
  }
  document.getElementById('analysis').innerHTML=html;
  document.getElementById('analysis').style.display='block';
}

const detailEl=document.getElementById('node-detail');
let detailOpen=null;

function showDetail(nodeId){
  if(detailOpen===nodeId){hideDetail();return}
  detailOpen=nodeId;
  const view=getView();const n=view.nMap[nodeId];
  if(!n){hideDetail();return}

  let data,c,color,isDirect,isIndirect,dist;
  if(level==='mod'){
    data=modData;c=data?data[nodeId]:null;dist=modDist||{};
  }else{
    const mf=new Set(MODULES[zoomedMod].files);
    data={};for(const[f,info]of Object.entries((activePR||{}).files||{}))if(mf.has(f))data[f]=info;
    c=data[nodeId]||null;dist={};for(const[f,d]of Object.entries(fileDist||{}))if(mf.has(f))dist[f]=d;
  }
  color=activePR?(TC[activePR.type]||'var(--acc)'):'var(--acc)';
  isDirect=c!==undefined&&c!==null;
  isIndirect=!isDirect&&lastDist&&lastDist[nodeId]!==undefined;

  const displayLabel=n.label||(n.tag?n.tag:nodeId);
  const displayTag=n.tag||(level==='files'?MODULES[zoomedMod].tag:'');
  let html=`<div style="border-left:3px solid ${isDirect?color:isIndirect?'#475569':'var(--bd)'};padding-left:8px">
    <div style="font-weight:600;color:var(--txb);font-size:14px">${displayLabel}</div>
    <div style="font-family:'Fira Code',monospace;font-size:10px;color:var(--txd)">${displayTag}</div>
  </div>`;

  if(isDirect){
    if(c.summary)html+=`<div style="color:var(--tx);font-size:12px;margin:8px 0;line-height:1.4">${c.summary}</div>`;
    if(c.files&&c.files.length)html+=`<div class="lbl" style="margin-top:6px">Files</div>${c.files.map(f=>`<div style="font-family:'Fira Code',monospace;font-size:11px;color:var(--txd);padding:2px 0">${f}</div>`).join('')}`;
    html+=`<div style="display:flex;gap:12px;margin-top:8px;font-family:'Fira Code',monospace;font-size:12px">
      <span style="color:var(--grn)">+${c.add}</span><span style="color:var(--red)">-${c.del}</span></div>`;
  }else if(isIndirect){
    const hop=lastDist[nodeId];
    html+=`<div style="color:var(--tx);font-size:12px;margin:8px 0;line-height:1.4">
      Indirectly affected (${hop} hop${hop>1?'s':''} from change)</div>`;
  }else if(!activePR){
    html+=`<div style="color:var(--txd);font-size:12px;margin:8px 0">Select a PR to see impact</div>`;
  }else{
    html+=`<div style="color:var(--txd);font-size:12px;margin:8px 0">Not affected by this PR</div>`;
  }

  if(level==='mod'){
    const m=MODULES[nodeId];
    if(m){
      const fc=m.files.length;
      html+=`<div style="margin-top:8px;border-top:1px solid var(--bd);padding-top:8px;text-align:center">
        <span style="color:var(--acc);cursor:pointer;font-size:12px;font-family:'Fira Code',monospace" onclick="hideDetail();zoomToFiles('${nodeId}')">explore ${fc} file${fc>1?'s':''} ▸</span></div>`;
    }
  }else{
    const imports=(RAW[nodeId]||[]).map(f=>f.replace('lib/','').replace('.js',''));
    const importedBy=[];
    for(const[file,deps]of Object.entries(RAW))if(deps.includes(nodeId))importedBy.push(file.replace('lib/','').replace('.js',''));
    if(imports.length||importedBy.length){
      html+=`<div style="margin-top:8px;border-top:1px solid var(--bd);padding-top:6px;font-size:11px">`;
      if(imports.length)html+=`<div style="margin-bottom:4px"><span style="color:var(--txd)">imports:</span> <span style="color:var(--tx)">${imports.slice(0,6).join(', ')}${imports.length>6?' ...':''}</span></div>`;
      if(importedBy.length)html+=`<div><span style="color:var(--txd)">imported by:</span> <span style="color:var(--tx)">${importedBy.slice(0,6).join(', ')}${importedBy.length>6?' ...':''}</span></div>`;
      html+=`</div>`;
    }
  }

  detailEl.innerHTML=html;detailEl.style.display='block';
  const nx=n.x+NW/2+16,ny=n.y-NH/2;
  detailEl.style.left=Math.min(nx,W-290)+'px';detailEl.style.top=Math.max(ny,10)+'px';
}

const bc0=document.getElementById('bc0'),crumb=document.getElementById('crumb');

function getFileNodes(modId){
  const files=MODULES[modId].files;
  const n=files.length;
  const cols=n<=3?1:2;
  const rows=Math.ceil(n/cols);
  const gapX=210,gapY=90;
  const sx=CX-(cols-1)*gapX/2;
  const sy=120;
  return files.map((f,i)=>({
    id:f,label:f.replace('lib/','').replace('.js',''),
    x:sx+(i%cols)*gapX,y:sy+Math.floor(i/cols)*gapY,
  }));
}

function getFileEdges(modId){
  const fs=new Set(MODULES[modId].files);
  const edges=[];
  for(const f of fs)for(const imp of(RAW[f]||[]))if(fs.has(imp))edges.push([f,imp]);
  return edges;
}

function zoomToFiles(modId){
  level='files';zoomedMod=modId;hideDetail();
  pan={x:0,y:0};gMod.style.transform='';gFiles.style.transform='';
  const n=modGraph.nMap[modId];
  gMod.style.transformOrigin=`${n.x}px ${n.y}px`;
  gMod.style.transform='scale(3)';gMod.style.opacity='0';gMod.style.pointerEvents='none';

  const fNodes=getFileNodes(modId);
  const fEdges=getFileEdges(modId);
  fileGraph=renderGraph(fNodes,fEdges,gFiles,{zoomable:false});
  fNodes.forEach(fn=>{
    fileGraph.nEls[fn.id].g.addEventListener('click',()=>showDetail(fn.id));
  });

  // external deps footer
  const deps=new Set(),users=new Set();
  for(const f of MODULES[modId].files){for(const imp of(RAW[f]||[])){const m=fileToMod[imp];if(m&&m!==modId)deps.add(MODULES[m].label)}}
  for(const[file,imps]of Object.entries(RAW)){const m=fileToMod[file];if(m&&m!==modId)for(const imp of imps)if(MODULES[modId].files.includes(imp))users.add(MODULES[m].label)}
  const parts=[];
  if(deps.size)parts.push('imports from: '+[...deps].join(', '));
  if(users.size)parts.push('used by: '+[...users].join(', '));
  if(parts.length){
    const ft=document.createElementNS(NS,'text');ft.textContent=parts.join('  ·  ');
    ft.setAttribute('x',CX);ft.setAttribute('y',H-60);ft.setAttribute('text-anchor','middle');
    ft.setAttribute('fill','#4a6a85');ft.setAttribute('font-size','11');ft.setAttribute('font-family',"'Fira Code',monospace");
    gFiles.appendChild(ft);
  }

  setTimeout(()=>{gFiles.style.opacity='1';gFiles.style.pointerEvents='auto'},250);
  bc0.classList.add('click');bc0.classList.remove('on');bc0.onclick=zoomToModules;
  const oldSep=document.getElementById('bcsep'),oldB=document.getElementById('bc1');
  if(oldSep)oldSep.remove();if(oldB)oldB.remove();
  const sep=document.createElement('span');sep.className='bcsep';sep.textContent='›';sep.id='bcsep';crumb.appendChild(sep);
  const b=document.createElement('span');b.className='bc on';b.id='bc1';b.textContent=MODULES[modId].label;crumb.appendChild(b);
  document.getElementById('vsub').textContent=`${MODULES[modId].label} · ${MODULES[modId].files.length} files`;
  if(activePR){resetAnimation();playAnimation()}
}

function zoomToModules(){
  level='mod';zoomedMod=null;hideDetail();
  pan={x:0,y:0};gFiles.style.transform='';
  gFiles.style.opacity='0';gFiles.style.pointerEvents='none';
  setTimeout(()=>{gMod.style.transform='scale(1)';gMod.style.opacity='1';gMod.style.pointerEvents='auto'},200);
  bc0.classList.remove('click');bc0.classList.add('on');bc0.onclick=null;
  const s=document.getElementById('bcsep'),b=document.getElementById('bc1');if(s)s.remove();if(b)b.remove();
  document.getElementById('vsub').textContent='fastify · 9 modules · 32 files';
  if(activePR){resetAnimation();playAnimation()}
}

// ═══════════════════════════════════════════════════════
// TOOLTIP & PAN
// ═══════════════════════════════════════════════════════
const tip=document.getElementById('tip');
function showTip(e,n){
  let h=`<div class="tip-n">${n.label||n.id}</div>`;
  if(level==='mod')h+=`<div class="tip-f">click to see details · hover for EXPLORE</div>`;
  if(activePR&&modData&&modData[n.id])h+=`<div class="tip-s">${modData[n.id].summary}</div>`;
  tip.innerHTML=h;tip.style.display='block';tip.style.left=(e.clientX+14)+'px';tip.style.top=(e.clientY-8)+'px';
}
function hideTip(){tip.style.display='none'}
document.addEventListener('mousemove',e=>{if(tip.style.display==='block'){tip.style.left=(e.clientX+14)+'px';tip.style.top=(e.clientY-8)+'px'}});

// add tooltips to module nodes
MOD_NODES.forEach(n=>{
  modGraph.nEls[n.id].g.addEventListener('mouseenter',e=>showTip(e,n));
  modGraph.nEls[n.id].g.addEventListener('mouseleave',hideTip);
});

let pan={x:0,y:0},panning=false,ps=null;
svg.addEventListener('mousedown',e=>{
  if(!e.target.closest('.node-group')){hideDetail();panning=true;ps={x:e.clientX-pan.x,y:e.clientY-pan.y}}
});
svg.addEventListener('mousemove',e=>{
  if(!panning)return;
  pan.x=e.clientX-ps.x;pan.y=e.clientY-ps.y;
  const g=level==='mod'?gMod:gFiles;
  if(level==='mod')g.style.transform=`translate(${pan.x}px,${pan.y}px) scale(1)`;
  else g.style.transform=`translate(${pan.x}px,${pan.y}px)`;
});
svg.addEventListener('mouseup',()=>{panning=false});
svg.addEventListener('mouseleave',()=>{panning=false});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&level==='files')zoomToModules()});
</script>
</body>
